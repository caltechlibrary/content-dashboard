<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Steward Dashboard— Caltech Library</title>
  <link rel="stylesheet" href="styles.css?v=0.0.4">
</head>
<body>
  <div class="layout">

    <!-- ── Sidebar ──────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <p>Content Dashboard</p>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">Views</div>
        <a class="nav-item active" data-view="my-website-pages" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h7a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
          </svg>
          Website Pages
        </a>
        <a class="nav-item" data-view="my-research-guides" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
          </svg>
          Research Guides
        </a>

<div class="nav-section">Tools</div>
        <a class="nav-item" data-view="reports" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11 4a1 1 0 10-2 0v4a1 1 0 102 0V7zm-3 1a1 1 0 10-2 0v3a1 1 0 102 0V8zM8 9a1 1 0 00-2 0v2a1 1 0 102 0V9z" clip-rule="evenodd"/>
          </svg>
          Reports
        </a>
        <a class="nav-item" data-view="manage-stewards" href="#">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
          Assign Roles
        </a>
        <a class="nav-item nav-item-external" href="https://caltech.libapps.com/libguides/guides.php" target="_blank" rel="noopener">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
            <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
          </svg>
          LibGuides admin
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-ghost" id="refresh-btn">↻ Refresh data</button>
        <div class="last-fetched" id="last-fetched"></div>
      </div>
    </aside>

    <!-- ── Main ─────────────────────────────────────────── -->
    <main class="main">

      <!-- Loading overlay -->
      <div id="loading" class="overlay hidden" role="status" aria-live="polite">
        <div class="overlay-body">
          <div class="spinner"></div>
          <p>Loading guides…</p>
        </div>
      </div>

      <!-- Error overlay -->
      <div id="error" class="overlay hidden" role="alert">
        <div class="overlay-body error-body">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <circle cx="12" cy="16" r=".5" fill="currentColor"/>
          </svg>
          <h3>Could not load data</h3>
          <p id="error-msg"></p>
          <button class="btn-primary" id="retry-btn">Try again</button>
        </div>
      </div>

      <!-- Site-wide announcement -->
      <div class="announce-banner" role="status">
        Due to an issue with the LibGuides API, Last Updated timestamps are not
        displaying accurate information. This issue has been reported to SpringShare.
      </div>

      <!-- Views (only one visible at a time) -->
      <div id="view-my-website-pages"   class="view"></div>
      <div id="view-my-research-guides" class="view hidden"></div>
      <div id="view-reports"            class="view hidden"></div>
      <div id="view-manage-stewards"    class="view hidden"></div>

    </main>
  </div>

  <script type="module" src="app.js?v=0.0.4"></script>
</body>
</html>
