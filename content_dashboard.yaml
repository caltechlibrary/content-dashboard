##
# content_dashboard.yaml provides configuration for the Deno API router/
# middleware used by Caltech Library's Content Dashboard. This is kept
# separate from content_dashboard_api.yaml (datasetd's config) because
# datasetd's strict YAML decoder rejects any top-level keys it doesn't
# recognize.
##

# Browser-facing configuration — served by the router at GET /api/config.
# Keys are snake_case; loadConfig() in app.js maps them to UPPER_CASE for
# backwards compatibility with existing CONFIG references.
browser_config:
  stale_days: 365
  very_stale_days: 730
  session_key: "cs_guides_v1"
  session_cache_ttl_seconds: 900
  website_page_groups: [26856, 27077]
  research_guide_groups: [10729]
  departments:
    - "Archives"
    - "ACS"
    - "CLOPS"
    - "DnD"
    - "RS"

# Deno API router configuration. Serves htdocs/, /api/* meta endpoints,
# /lg/api/* (proxied LibGuides), and /ds/api/* (proxied to datasetd).
# Credentials must be supplied via environment variables — never hardcoded here.
router:
  port: 8200
  libguides:
    base_url: "https://lgapi-us.libapps.com/1.2"
    token_url: "https://lgapi-us.libapps.com/1.2/oauth/token"
    client_id: "${LIBGUIDES_CLIENT_ID}"
    client_secret: "${LIBGUIDES_CLIENT_SECRET}"
  # Confluence Cloud, read with a personal API token. The token only sees
  # the spaces its owner can see.
  confluence:
    base_url: "https://caltechlibrary.atlassian.net/wiki"
    email: "${CONFLUENCE_EMAIL}"
    api_token: "${CONFLUENCE_API_TOKEN}"
  cache:
    enabled: true
    ttl_seconds: 300
  dataset:
    base_url: "http://localhost:8201"
