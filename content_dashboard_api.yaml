##
# content_dashboard_api.yaml provides a Web Service backed by dataset v2.4.1 to manage
# content audits and analysis for Caltech Library's LibGuides deployment and website.
##
host: localhost:8201
htdocs: htdocs
schemas:
  stewardship_model:
    id: stewardship_model
    description: |
      Model for content stewardship assignments. Each entry represents
      the expert and department assignments for a LibGuides page.
    elements:
      - id: pageId
        type: text
        attributes:
          name: pageId
          required: true
        pattern: "^[0-9]+$"
        is_primary_id: true
        label: "Page ID"

      - id: expert
        type: text
        attributes:
          name: expert
        label: "Expert"

      - id: department
        type: text
        attributes:
          name: department
        options:
          - {"": "Unassigned"}
          - {"Archives": "Archives"}
          - {"ACS": "ACS"}
          - {"CLOPS": "CLOPS"}
          - {"DLD": "DLD"}
          - {"LIT": "LIT"}
          - {"RS": "RS"}
        label: "Department"

      - id: lastUpdated
        type: datetime-local
        attributes:
          name: lastUpdated
          required: true
        generator: "timestamp"
        label: "Last Updated"

      - id: updatedBy
        type: text
        attributes:
          name: updatedBy
        label: "Updated By"

  audit_model:
    id: audit_model
    description: |
      Model for audit check results. Each entry tracks the audit status
      (links, accessibility, accuracy) for a page, a guide, or a
      Confluence space.
    elements:
      - id: type
        type: text
        attributes:
          name: type
          required: true
        options:
          - {"page": "Page"}
          - {"guide": "Guide"}
          - {"space": "Confluence Space"}
        is_primary_id: true
        label: "Content Type"

      # LibGuides page and guide IDs are numbers, but Confluence space keys
      # are short words (DLD, ALS, Website), so this can't be digits-only.
      - id: id
        type: text
        attributes:
          name: id
          required: true
        pattern: "^[A-Za-z0-9_-]+$"
        is_primary_id: true
        label: "ID"

      - id: links
        type: checkbox
        attributes:
          name: links
          required: true
        label: "Links Check Passed"

      - id: accessibility
        type: checkbox
        attributes:
          name: accessibility
          required: true
        label: "Accessibility Check Passed"

      - id: accuracy
        type: checkbox
        attributes:
          name: accuracy
          required: true
        label: "Accuracy Check Passed"

      - id: updatedAt
        type: datetime-local
        attributes:
          name: updatedAt
          required: true
        generator: "timestamp"
        label: "Audit Updated"

      - id: updatedBy
        type: text
        attributes:
          name: updatedBy
        label: "Updated By"

  confluence_model:
    id: confluence_model
    description: |
      Model for Confluence space ownership. One entry per current team
      space, imported from the Confluence "Spaces report" CSV export by
      convert_confluence.ts. Owners are people, not departments.
    elements:
      - id: spaceKey
        type: text
        attributes:
          name: spaceKey
          required: true
        is_primary_id: true
        label: "Space Key"

      - id: spaceName
        type: text
        attributes:
          name: spaceName
        label: "Space Name"

      - id: owner
        type: text
        attributes:
          name: owner
        label: "Owner"

      # From the export, not editable in the dashboard. Blank for spaces
      # nobody has opened in the window Confluence reports on.
      - id: lastViewed
        type: text
        attributes:
          name: lastViewed
        label: "Last Viewed"

      - id: contentCount
        type: number
        attributes:
          name: contentCount
        label: "Pages"

      - id: lastUpdated
        type: datetime-local
        attributes:
          name: lastUpdated
        generator: "timestamp"
        label: "Last Updated"

      - id: updatedBy
        type: text
        attributes:
          name: updatedBy
        label: "Updated By"

# Collections — note: list format (- dataset: ...), not a mapping.
# schema: references a key from the schemas: map above.
# Arrow operators (->, ->>) require SQLite 3.38+; SQLite booleans are 0/1.
collections:
  - dataset: stewardship.ds
    schema: stewardship_model
    validate: true
    keys: true
    read: true
    create: true
    update: true
    delete: true
    query:
      by_expert: |
        SELECT src FROM content_stewardship WHERE src->>'expert' = ?
      by_department: |
        SELECT src FROM content_stewardship WHERE src->>'department' = ?
      unassigned: |
        SELECT src FROM content_stewardship
        WHERE (src->>'expert' IS NULL OR src->>'expert' = '')
      needs_update: |
        SELECT src FROM content_stewardship
        WHERE src->>'lastUpdated' < datetime('now', '-365 days')

  - dataset: audit.ds
    schema: audit_model
    validate: false
    keys: true
    read: true
    create: true
    update: true
    delete: true
    query:
      by_type: |
        SELECT src FROM content_audit WHERE src->>'type' = ?
      by_id: |
        SELECT src FROM content_audit WHERE src->>'id' = ?
      by_type_and_id: |
        SELECT src FROM content_audit WHERE src->>'type' = ? AND src->>'id' = ?
      stale_audits: |
        SELECT src FROM content_audit
        WHERE src->>'updatedAt' < datetime('now', '-90 days')
      incomplete: |
        SELECT src FROM content_audit
        WHERE src->>'links' = 0
           OR src->>'accessibility' = 0
           OR src->>'accuracy' = 0

  - dataset: confluence.ds
    schema: confluence_model
    validate: false
    keys: true
    read: true
    create: true
    update: true
    delete: true
    query:
      by_owner: |
        SELECT src FROM confluence WHERE src->>'owner' = ?
      unassigned: |
        SELECT src FROM confluence
        WHERE (src->>'owner' IS NULL OR src->>'owner' = '')
      unviewed: |
        SELECT src FROM confluence
        WHERE (src->>'lastViewed' IS NULL OR src->>'lastViewed' = '')
      empty_spaces: |
        SELECT src FROM confluence WHERE src->>'contentCount' = 0
